<!doctype html>

<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HLKS-Tools</title>
  <meta name="description" content="Rechenwerkzeuge für Heizung, Lüftung, Klima und Sanitär." />
  <script>try { const t = localStorage.getItem('hlks-tools:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/home.css" />
  <script type="module" src="assets/js/home.js"></script>
</head>
<body class="home">
  <div class="home-wrap">
    <header class="home-head">
      <h1 class="wordmark">HLKS-Tools</h1>
      <div class="home-actions">
        <button class="btn" id="open-dossier" title="Projekt-Dossier erstellen"></button>
        <button class="btn primary" id="open-file" title="Öffnen (PDF, JSON, .schema)"></button>
        <button class="btn ghost icon-only" id="theme-toggle"></button>
      </div>
    </header>

    <main class="disciplines" id="tools" aria-label="Werkzeuge"></main>
    <nav class="general-tools" id="general-tools" aria-label="Weitere Werkzeuge" hidden></nav>
  </div>

  <dialog id="dossier-dialog" class="dossier-dialog" aria-label="Projekt-Dossier"></dialog>
  <div class="drop-overlay" aria-hidden="true"><span>PDF / JSON / .schema öffnen</span></div>
</body>
</html>
