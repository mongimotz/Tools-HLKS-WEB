<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HLKS-Tools</title>
  <meta name="description" content="Rechenwerkzeuge für Heizung, Lüftung, Klima und Sanitär." />
  <script>try { const t = localStorage.getItem('hlks-tools:theme'); if (t && t !== 'system') document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/home.css" />
  <script type="module" src="assets/js/home.js"></script>
</head>
<body class="home">
  <div class="home-wrap">
    <header class="home-head">
      <h1 class="wordmark">HLKS-Tools</h1>
      <div class="home-actions">
        <button class="btn primary" id="open-file" title="Öffnen (PDF, JSON)"></button>
        <button class="btn ghost icon-only" id="theme-toggle"></button>
      </div>
    </header>

    <main class="network" aria-label="Werkzeuge">
      <div class="fan" aria-hidden="true">
        <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="27"/><path d="M18 17 L48 32 L18 47"/></svg>
      </div>
      <ol class="branches" id="tools"></ol>
    </main>
  </div>

  <div class="drop-overlay" aria-hidden="true"><span>PDF / JSON öffnen</span></div>
</body>
</html>
