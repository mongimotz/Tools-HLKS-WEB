<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF-Editor – HLKS-Tools</title>
  <meta name="description" content="PDF-Pläne im Browser bearbeiten: kommentieren, messen, stempeln, unterschreiben, Formulare, Seiten und Dokumentwerkzeuge." />
  <script>try { const t = localStorage.getItem('hlks-tools:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/css/tokens.css" />
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="app.js"></script>
</head>
<body class="pe">
  <header class="appbar">
    <a class="brand" href="../../" title="Zur Startseite">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.2 7.6 18.8 12 5.2 16.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      HLKS-Tools
    </a>
    <span class="appbar-title">PDF-Editor</span>
    <div class="appbar-actions">
      <button class="btn ghost icon-only" data-action="undo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig" disabled></button>
      <button class="btn ghost icon-only" data-action="redo" title="Wiederholen (Strg+Y)" aria-label="Wiederholen" disabled></button>
      <span class="appbar-sep"></span>
      <button class="btn ghost icon-only" data-action="open" title="PDF öffnen (Strg+O)" aria-label="PDF öffnen"></button>
      <button class="btn primary" data-action="save" title="PDF speichern (Strg+S)" disabled></button>
      <button class="btn ghost" data-action="to-dxf" title="An PDF → DXF übergeben" disabled></button>
      <div class="menu" id="more-menu" hidden>
        <button class="btn ghost icon-only" data-action="menu" aria-haspopup="true" aria-expanded="false" aria-label="Weitere Aktionen" title="Weitere Aktionen"></button>
        <ul class="menu-list" role="menu" id="more-list"></ul>
      </div>
    </div>
  </header>

  <main class="pe-layout">
    <div class="pe-issues" id="issues"></div>
    <embedpdf-viewer id="viewer" class="pe-viewer">
      <div slot="empty" class="pe-empty"><button type="button" class="btn primary big" data-action="open" title="PDF öffnen (Strg+O)"></button></div>
    </embedpdf-viewer>
  </main>

  <div class="drop-overlay" aria-hidden="true"><span>PDF öffnen</span></div>
</body>
</html>
