<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Druckverlust Lüftung – HLKS-Tools</title>
  <meta name="description" content="Druckverlustberechnung für Lüftungskanäle: Teilstrecken, Formstücke, Einbauteile, kritischer Strang und Drosselbedarf." />
  <script>try { const t = localStorage.getItem('hlks-tools:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/css/tokens.css" />
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="appbar">
    <a class="brand" href="../../" title="Zur Startseite">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.2 7.6 18.8 12 5.2 16.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      HLKS-Tools
    </a>
    <span class="appbar-title">Druckverlust Lüftung</span>
    <div class="appbar-actions">
      <button class="btn ghost icon-only" data-action="undo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig"></button>
      <button class="btn ghost icon-only" data-action="redo" title="Wiederholen (Strg+Y)" aria-label="Wiederholen"></button>
      <span class="appbar-sep"></span>
      <button class="btn ghost icon-only" data-action="open" title="Öffnen (Strg+O)" aria-label="Öffnen"></button>
      <button class="btn primary" data-action="export-pdf" title="PDF speichern (Strg+S)"></button>
      <div class="menu" id="more-menu">
        <button class="btn ghost icon-only" data-action="menu" aria-haspopup="true" aria-expanded="false" aria-label="Weitere Aktionen"></button>
        <ul class="menu-list" role="menu">
          <li><button data-action="new" role="menuitem">Neue Berechnung</button></li>
          <li><button data-action="example" role="menuitem">Beispiel laden</button></li>
          <li><hr /></li>
          <li><button data-action="export-json" role="menuitem">JSON speichern</button></li>
          <li><button data-action="export-csv" role="menuitem">CSV speichern</button></li>
        </ul>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="workspace-head">
      <div id="project"></div>
      <div id="issue-panel"></div>
    </div>

    <div class="calculation-bar">
      <div id="calculation-tabs"></div>
      <button class="btn ghost icon-only" data-action="catalogs" title="Kataloge" aria-label="Kataloge"></button>
    </div>

    <section class="result-strip" id="summary" aria-live="polite" aria-label="Ergebnis"></section>

    <div class="tab-panel" id="calculation-panel" role="tabpanel">
      <section class="block" aria-labelledby="system-title">
        <div class="section-head"><h2 class="section-title" id="system-title">Anlage</h2></div>
        <div id="system" class="system-grid"></div>
      </section>

      <section class="block" aria-labelledby="sections-title">
        <div class="section-head">
          <h2 class="section-title" id="sections-title">Teilstrecken</h2>
          <div class="table-tools">
            <label class="view-select" title="Spalten">
              <select class="select" id="columns-view" aria-label="Spalten">
                <option value="compact">Kompakt</option>
                <option value="standard">Standard</option>
                <option value="all">Alle</option>
              </select>
            </label>
          </div>
        </div>
        <div class="table-wrap panel">
          <table class="sections" id="sections-table"></table>
        </div>
        <div class="below-table">
          <button class="btn" data-action="add-section"></button>
        </div>
      </section>

      <section class="block charts" aria-label="Diagramme">
        <figure class="panel chart-panel" id="profile-panel">
          <figcaption><h3>Druckverlauf kritischer Strang</h3></figcaption>
          <div class="chart" id="profile-chart"></div>
        </figure>
        <figure class="panel chart-panel" id="network-panel">
          <figcaption><h3>Strangschema</h3></figcaption>
          <div class="chart network-scroll" id="network-chart"></div>
        </figure>
      </section>
    </div>

  </main>

  <dialog id="catalog-dialog" class="catalog-dialog" aria-label="Kataloge">
    <div class="catalog-dialog-head">
      <h2>Kataloge</h2>
      <button class="btn ghost icon-only" data-catalog-close title="Schliessen" aria-label="Schliessen"></button>
    </div>
    <div id="catalogs" class="catalog-grid"></div>
  </dialog>

  <div class="drop-overlay" aria-hidden="true"><span>PDF / JSON öffnen</span></div>
</body>
</html>
